name: Deploy Cert-Manager and Reflector

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (prod or stg or qa)'
        required: true
        type: choice
        options:
          - prod
          - stg
          - qa

jobs:
  deploy:
    name: Deploy Cert-Manager and Reflector with Helm
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    env:
      CLUSTER_NAME: my-${{ inputs.environment }}-aks
      RESOURCE_GROUP: my-${{ inputs.environment }}-apps-rg
      ENV: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0

      - name: Add Cert-Manager and Reflector Helm repos
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo add emberstack https://emberstack.github.io/helm-charts
          helm repo update

      - name: Install cert-manager
        run: |
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --version v1.20.3 \
            -f cert-manager/${ENV}/values.yaml \
            --set installCRDs=false \
            --force-conflicts

      - name: Install reflector
        run: |
          helm upgrade --install reflector emberstack/reflector \
            --namespace cert-manager \
            --create-namespace \
            -f cert-manager/${ENV}/reflector-values.yaml

      - name: Apply ClusterIssuer and Certificates
        run: |
          if [ -d "cert-manager/${ENV}" ]; then
            ls cert-manager/${ENV}/ | grep -v "values" | xargs -I{} kubectl apply -f cert-manager/${ENV}/{}
          fi
