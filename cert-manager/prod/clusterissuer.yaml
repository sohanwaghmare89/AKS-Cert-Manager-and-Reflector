apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: email@mydomain.tech
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # Solver for aurainsure.tech hosted zone 
      - selector:
          dnsZones:
            - "mydomain.tech"
        dns01:
          cloudflare:
            email: email@mydomain.tech
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token

      # Solver for aurainsure.ai hosted zone 
      - selector:
          dnsZones:
            - "mydomain.com"
        dns01:
          cloudflare:
            email: email@mydomain.tech
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
      
      #         key: secret-access-key
